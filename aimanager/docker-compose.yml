services:
  aimanager:
    build:
      context: ..
      target: runtime
    image: aimanager-litellm:local
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      LITELLM_MASTER_KEY:
      YCAPI_BASE_URL: "${YCAPI_BASE_URL:-https://ycapi.ycaicloud.com/v1}"
      YCAPI_API_TOKEN:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aimanager}:${POSTGRES_PASSWORD:-aimanager}@db:5432/${POSTGRES_DB:-aimanager}"
      STORE_MODEL_IN_DB: "False"
      CONFIG_FILE_PATH: "/app/config.yaml"
      AIMANAGER_ROUTE_SURFACE: "business"
      AIMANAGER_DATABASE_READY_CHECK_ENABLED: "True"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    entrypoint:
      - "python"
      - "-m"
      - "aimanager.litellm_entrypoint"
    command:
      - "--config=/app/config.yaml"
      - "--host=0.0.0.0"
      - "--port=4000"
      - "--enforce_prisma_migration_check"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aimanager-admin:
    profiles: ["admin"]
    image: aimanager-litellm:local
    ports:
      - "127.0.0.1:4001:4000"
    env_file:
      - path: .env
        required: false
    environment:
      LITELLM_MASTER_KEY:
      YCAPI_BASE_URL: "${YCAPI_BASE_URL:-https://ycapi.ycaicloud.com/v1}"
      YCAPI_API_TOKEN:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aimanager}:${POSTGRES_PASSWORD:-aimanager}@db:5432/${POSTGRES_DB:-aimanager}"
      STORE_MODEL_IN_DB: "False"
      CONFIG_FILE_PATH: "/app/config.yaml"
      AIMANAGER_ROUTE_SURFACE: "management"
      AIMANAGER_RBAC_ENABLED: "True"
      AIMANAGER_DATABASE_READY_CHECK_ENABLED: "True"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    entrypoint:
      - "python"
      - "-m"
      - "aimanager.litellm_entrypoint"
    command:
      - "--config=/app/config.yaml"
      - "--host=0.0.0.0"
      - "--port=4000"
      - "--enforce_prisma_migration_check"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-aimanager}"
      POSTGRES_USER: "${POSTGRES_USER:-aimanager}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aimanager}"
    ports:
      - "127.0.0.1:${AIMANAGER_POSTGRES_PORT:-15440}:5432"
    volumes:
      - aimanager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-aimanager} -U ${POSTGRES_USER:-aimanager}"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  aimanager_postgres_data:
